<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School and Learning</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #2980b9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .quiz-card { background-color: #f4f7f6; border-radius: 16px; padding: 24px; width: 100%; max-width: 700px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .back-btn { text-decoration: none; color: #2980b9; font-weight: bold; background: #fff; padding: 8px 14px; border-radius: 8px; border: 2px solid #2980b9; }
    .header-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 15px; }
    .comic-scene { position: relative; height: 300px; background: linear-gradient(to bottom, #74ebd5 0%, #74ebd5 65%, #f4d03f 65%, #f4d03f 100%); border-radius: 12px; border: 4px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; }
    .sun { position: absolute; top: 15px; right: 25px; width: 45px; height: 45px; background-color: #FFD700; border-radius: 50%; box-shadow: 0 0 15px #FFD700; }
    .character { position: absolute; bottom: 10px; font-size: 85px; line-height: 1; }
    .char-left { left: 10%; } .char-right { right: 10%; }
    .speech-bubble { position: absolute; background: #fff; border-radius: 15px; padding: 12px; font-weight: bold; font-size: 16px; color: #333; width: 42%; box-shadow: 0 4px 10px rgba(0,0,0,0.15); bottom: 125px; display: flex; align-items: center; justify-content: center; min-height: 75px; }
    .speech-bubble::after { content: ''; position: absolute; bottom: -15px; border-width: 15px 15px 0; border-style: solid; display: block; width: 0; }
    .bubble-left { left: 4%; border: 3px dashed #2980b9; color: #2980b9; background: #ebf5fb; }
    .bubble-left::after { left: 30%; border-color: #2980b9 transparent transparent transparent; }
    .bubble-right { right: 4%; border: 3px solid #fff; }
    .bubble-right::after { right: 30%; border-color: #fff transparent transparent transparent; }
    .options-container { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
    .option-btn { background-color: #fff; border: 2px solid #bdc3c7; color: #2c3e50; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: bold; cursor: pointer; flex: 1; transition: all 0.2s; }
    .option-btn:hover { border-color: #2980b9; background-color: #ebf5fb; }
    .option-btn.selected { border-color: #2980b9; background-color: #ebf5fb; color: #1b4f72; }
    .action-btn { background-color: #ff9800; color: white; border: none; border-radius: 10px; padding: 12px 28px; font-size: 17px; font-weight: bold; cursor: pointer; }
    .action-btn:disabled { background-color: #d5d8dc; color: #999; cursor: not-allowed; }
    .feedback { margin-top: 12px; font-size: 17px; font-weight: bold; min-height: 25px; }
    .feedback.correct { color: #27ae60; } .feedback.incorrect { color: #e74c3c; }
    .progress { font-size: 14px; color: #7f8c8d; font-weight: bold; }
  </style>
</head>
<body>
  <div class="quiz-card">
    <div class="top-bar">
      <a href="index.html" class="back-btn">⬅ Menu</a>
      <div class="progress" id="progress">Task 1 of 10</div>
    </div>
    <div class="header-title">School and Learning</div>
    <div class="comic-scene">
      <div class="sun"></div>
      <div class="speech-bubble bubble-left" id="placeholder">???</div>
      <div class="character char-left" id="char-left">🧔</div>
      <div class="speech-bubble bubble-right" id="answer-text"></div>
      <div class="character char-right" id="char-right">👦</div>
    </div>
    <div class="options-container" id="options-container"></div>
    <button class="action-btn" id="check-btn" onclick="checkAnswer()">Check</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    const quizData = [
  {
    "answer": "- My favorite subject is drawing.",
    "options": [
      "- What is your favorite subject?",
      "- How many candies do you have?"
    ],
    "correct": 0,
    "emojiLeft": "👦",
    "emojiRight": "👧"
  },
  {
    "answer": "- I am in class 1-B.",
    "options": [
      "- Where is your dog?",
      "- What class are you in?"
    ],
    "correct": 1,
    "emojiLeft": "👩‍🏫",
    "emojiRight": "👦"
  },
  {
    "answer": "- The backpack is on the chair.",
    "options": [
      "- Where is the backpack?",
      "- Who ate the apple?"
    ],
    "correct": 0,
    "emojiLeft": "👧",
    "emojiRight": "👦"
  },
  {
    "answer": "- You need a sports uniform for PE class.",
    "options": [
      "- When does it snow?",
      "- What do you need for PE class?"
    ],
    "correct": 1,
    "emojiLeft": "👨‍🏫",
    "emojiRight": "👧"
  },
  {
    "answer": "- The bell rings at nine o'clock.",
    "options": [
      "- When does the bell ring?",
      "- What is your cat's name?"
    ],
    "correct": 0,
    "emojiLeft": "👦",
    "emojiRight": "👦"
  },
  {
    "answer": "- We play games at recess.",
    "options": [
      "- Where do birds fly?",
      "- What do you do at recess?"
    ],
    "correct": 1,
    "emojiLeft": "👧",
    "emojiRight": "👧"
  },
  {
    "answer": "- There are colored pencils in the pencil case.",
    "options": [
      "- What is in the pencil case?",
      "- What season is it now?"
    ],
    "correct": 0,
    "emojiLeft": "👨",
    "emojiRight": "👦"
  },
  {
    "answer": "- My best friend is Taras.",
    "options": [
      "- Where do mushrooms grow?",
      "- Who is your best friend?"
    ],
    "correct": 1,
    "emojiLeft": "👧",
    "emojiRight": "👧"
  },
  {
    "answer": "- The library is on the second floor.",
    "options": [
      "- Where is the library?",
      "- What is two times five?"
    ],
    "correct": 0,
    "emojiLeft": "👦",
    "emojiRight": "👩‍🏫"
  },
  {
    "answer": "- The teacher is reading an interesting fairy tale.",
    "options": [
      "- When do you go to bed?",
      "- What is the teacher doing?"
    ],
    "correct": 1,
    "emojiLeft": "👧",
    "emojiRight": "👦"
  }
];
    let currentTask = 0, selectedOptionIndex = null;
    function loadTask() {
      const task = quizData[currentTask];
      selectedOptionIndex = null;
      document.getElementById('progress').innerText = `Task ${currentTask + 1} of ${quizData.length}`;
      document.getElementById('answer-text').innerText = task.answer;
      document.getElementById('placeholder').innerText = "???";
      document.getElementById('char-left').innerText = task.emojiLeft;
      document.getElementById('char-right').innerText = task.emojiRight;
      document.getElementById('feedback').innerText = "";
      document.getElementById('feedback').className = "feedback";
      const checkBtn = document.getElementById('check-btn');
      checkBtn.innerText = "Check"; checkBtn.onclick = checkAnswer; checkBtn.disabled = true;
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      task.options.forEach((optionText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn'; btn.innerText = optionText;
        btn.onclick = () => selectOption(index, optionText);
        optionsContainer.appendChild(btn);
      });
    }
    function selectOption(index, optionText) {
      selectedOptionIndex = index;
      document.getElementById('placeholder').innerText = optionText;
      document.querySelectorAll('.option-btn').forEach((btn, i) => btn.classList.toggle('selected', i === index));
      document.getElementById('check-btn').disabled = false;
      document.getElementById('feedback').innerText = "";
    }
    function checkAnswer() {
      const task = quizData[currentTask], feedback = document.getElementById('feedback'), checkBtn = document.getElementById('check-btn');
      if (selectedOptionIndex === task.correct) {
        feedback.innerText = "Correct! Great job!"; feedback.className = "feedback correct";
        if (currentTask < quizData.length - 1) { checkBtn.innerText = "Next"; checkBtn.onclick = nextTask; }
        else { checkBtn.innerText = "Finish"; checkBtn.onclick = finishQuiz; }
      } else { feedback.innerText = "Incorrect. Try again!"; feedback.className = "feedback incorrect"; }
    }
    function nextTask() { currentTask++; loadTask(); }
    function finishQuiz() {
      document.querySelector('.quiz-card').innerHTML = `
        <h2 style="color: #2980b9; font-size: 26px;">Great work! 🎉</h2>
        <p style="font-size: 17px; margin-bottom: 20px;">You have successfully completed all 10 tasks of this topic!</p>
        <div style="display:flex; gap:10px; justify-content:center;">
          <a href="index.html" class="action-btn" style="text-decoration:none; background:#34495e;">To menu</a>
          <button class="action-btn" onclick="location.reload()">Play again</button>
        </div>`;
    }
    loadTask();
  </script>
</body>
</html>
