<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furniture Word Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: an aisle — a shelf of picture tiles above a rail of hanging price tags */
:root {
  --bg: #e9ebf4;          /* soft wall */
  --shelf: #ffffff;
  --shelf-edge: #8a5a3b;  /* wooden floorboard */
  --ink: #2a2433;
  --muted: #6b6478;
  --tag: #a8dcd1;         /* name-tag mint */
  --tag-ink: #10302a;
  --good: #2e9e5b;
  --bad: #d64545;
  --pick: #5b4bd1;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1b24; --shelf: #2a2733; --shelf-edge: #c99068; --ink: #efeaf5; --muted: #aaa3b8;
    --tag: #7cc4b4; --tag-ink: #0c2620; --good: #4cc77f; --bad: #ff6b6b; --pick: #9d90ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1b24; --shelf: #2a2733; --shelf-edge: #c99068; --ink: #efeaf5; --muted: #aaa3b8;
  --tag: #7cc4b4; --tag-ink: #0c2620; --good: #4cc77f; --bad: #ff6b6b; --pick: #9d90ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 6vw, 2.8rem); line-height: 1; margin: 0; text-wrap: balance; }
h1 span { color: var(--shelf-edge); }
.lead { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
.score { font-family: var(--display); font-weight: 800; font-size: 1.15rem; background: var(--shelf); border: 2px solid var(--shelf-edge); border-radius: 999px; padding: 6px 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.label { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .82rem; color: var(--muted); margin: 0 0 8px; }

/* Shelf of pictures */
.shelf {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
  padding: 14px; background: var(--shelf); border-radius: 14px;
  border-bottom: 10px solid var(--shelf-edge);
}
@media (min-width: 700px) { .shelf { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.pic {
  appearance: none; border: 3px solid transparent; background: var(--bg); border-radius: 12px;
  padding: 8px 6px 6px; cursor: pointer; display: grid; gap: 4px; justify-items: center;
  font: inherit; color: inherit; transition: transform .15s, border-color .15s;
}
.pic svg { width: 100%; max-width: 110px; aspect-ratio: 1; display: block; }
.pic .caption { font-family: var(--body); font-weight: 700; font-size: 1.05rem; min-height: 1.4em; color: var(--good); }
.pic:hover { transform: translateY(-2px); }
.pic.selected { border-color: var(--pick); transform: translateY(-3px); }
.pic.done { border-color: var(--good); cursor: default; transform: none; }

/* Rail of price tags */
.rail { display: flex; flex-wrap: wrap; gap: 14px 12px; justify-content: center; padding-top: 6px; border-top: 4px dashed color-mix(in srgb, var(--shelf-edge) 40%, transparent); padding-block: 16px 4px; }
.tag {
  appearance: none; border: 0; cursor: pointer; position: relative;
  font-family: var(--body); font-weight: 700; font-size: 1.3rem; color: var(--tag-ink);
  background: var(--tag); padding: 12px 22px 12px 34px; min-width: 120px;
  clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%);
  transition: transform .15s, filter .15s, opacity .3s;
}
.tag::before { content: ""; position: absolute; left: 13px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--bg); }
.tag:hover { transform: rotate(-2deg); }
.tag.selected { filter: drop-shadow(0 0 0 var(--pick)); outline: none; transform: translateY(-4px) rotate(-3deg); background: color-mix(in srgb, var(--tag) 70%, var(--pick)); }
.tag.done { opacity: 0; pointer-events: none; }
button:focus-visible { outline: 3px solid var(--pick); outline-offset: 3px; }
.tag:focus-visible { outline: none; filter: brightness(1.08); transform: translateY(-4px); }

.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { translate: -6px 0; } 40%,80% { translate: 6px 0; } }
.pop { animation: pop .45s; }
@keyframes pop { 40% { scale: 1.12; } }

.feedback { min-height: 1.6em; text-align: center; font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--bad); }

.win { text-align: center; background: var(--shelf); border-radius: 14px; padding: 22px 16px; border: 3px solid var(--good); display: grid; gap: 12px; justify-items: center; }
.win h2 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 0; color: var(--good); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn { font-family: var(--display); font-weight: 800; font-size: 1.1rem; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; background: var(--shelf-edge); color: var(--shelf); }
.btn.ghost { background: transparent; color: var(--shelf-edge); border: 2px solid var(--shelf-edge); }
.sound { font-size: .95rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Around the <span>House</span></h1>
      <p class="lead">Tap a picture, then tap its word.</p>
    </div>
    <div class="score" id="score" aria-live="polite">Round 1 / 5</div>
  </header>

  <section>
    <p class="label">In the room</p>
    <div class="shelf" id="shelf"></div>
  </section>

  <p class="feedback" id="feedback" aria-live="polite"></p>

  <section>
    <p class="label">Name tags</p>
    <div class="rail" id="rail"></div>
  </section>

  <div class="win" id="win" hidden>
    <h2 id="winTitle"></h2>
    <p id="winText" style="margin:0"></p>
    <button class="btn" id="winBtn">Next round</button>
  </div>

  <div class="controls">
    <label class="sound"><input type="checkbox" id="soundOn" checked> Say the word</label>
  </div>
</div>

const ROUND = 6;      // pictures per round
const ROUNDS = 5;     // rounds per game
const shelf = document.getElementById("shelf");
const rail = document.getElementById("rail");
const scoreEl = document.getElementById("score");
const fb = document.getElementById("feedback");
const win = document.getElementById("win");
const winTitle = document.getElementById("winTitle");
const winText = document.getElementById("winText");
const winBtn = document.getElementById("winBtn");
const soundOn = document.getElementById("soundOn");
let picked = null, matched = 0, round = 0, mistakes = 0, deck = [];

const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = (w) => w[0].toUpperCase() + w.slice(1);

function say(word) {
  if (!soundOn.checked) return;
  try {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-GB"; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

// Every word appears once before any word repeats; no word twice in the same round.
function takeSet() {
  const set = [];
  let i = 0;
  while (set.length < ROUND) {
    if (i >= deck.length) { deck = deck.concat(shuffle(ITEMS)); }
    if (set.some(s => s.word === deck[i].word)) { i++; continue; }
    set.push(deck.splice(i, 1)[0]);
  }
  return set;
}

function startGame() {
  round = 0; mistakes = 0; deck = shuffle(ITEMS);
  nextRound();
}

function nextRound() {
  round++;
  const set = takeSet();
  picked = null; matched = 0;
  shelf.innerHTML = ""; rail.innerHTML = "";
  win.hidden = true; fb.textContent = ""; fb.className = "feedback";
  shuffle(set).forEach((item, n) => {
    const b = document.createElement("button");
    b.className = "pic"; b.dataset.word = item.word; b.dataset.kind = "pic";
    b.setAttribute("aria-label", "Picture " + (n + 1));
    b.innerHTML = item.svg + '<span class="caption"></span>';
    shelf.appendChild(b);
  });
  shuffle(set).forEach(item => {
    const t = document.createElement("button");
    t.className = "tag"; t.dataset.word = item.word; t.dataset.kind = "tag";
    t.textContent = item.word;
    rail.appendChild(t);
  });
  updateScore();
}

function updateScore() { scoreEl.textContent = `Round ${round} / ${ROUNDS}`; }

function roundDone() {
  fb.textContent = "";
  rail.innerHTML = "";
  if (round < ROUNDS) {
    const b = document.createElement("button");
    b.className = "btn"; b.textContent = "Next round";
    b.addEventListener("click", () => { nextRound(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    rail.appendChild(b);
    b.focus({ preventScroll: true });
    b.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  } else {
    winTitle.textContent = "Room finished! 🏠";
    winText.textContent = `You matched ${ROUND * ROUNDS} words` + (mistakes === 0 ? " with no mistakes!" : ` with ${mistakes} ${mistakes === 1 ? "mistake" : "mistakes"}.`);
    winBtn.textContent = "Play again";
  }
  win.hidden = false;
  winBtn.focus({ preventScroll: true });
  win.scrollIntoView({ behavior: "smooth", block: "center" });
}

function clearPick() { document.querySelectorAll(".selected").forEach(el => el.classList.remove("selected")); picked = null; }

function handle(el) {
  if (el.classList.contains("done") || !win.hidden) return;
  if (!picked || picked.dataset.kind === el.dataset.kind) {
    clearPick(); picked = el; el.classList.add("selected");
    if (el.dataset.kind === "tag") say(el.dataset.word);
    return;
  }
  const pic = el.dataset.kind === "pic" ? el : picked;
  const tag = el.dataset.kind === "tag" ? el : picked;
  if (pic.dataset.word === tag.dataset.word) {
    pic.classList.add("done", "pop"); tag.classList.add("done");
    pic.querySelector(".caption").textContent = pic.dataset.word;
    pic.setAttribute("aria-label", pic.dataset.word + ", matched");
    fb.textContent = "Yes! " + cap(pic.dataset.word) + "!"; fb.className = "feedback ok";
    if (el.dataset.kind === "tag") say(pic.dataset.word);
    matched++; updateScore(); clearPick();
    if (matched === ROUND) setTimeout(roundDone, 600);
  } else {
    mistakes++;
    [pic, tag].forEach(x => { x.classList.remove("shake"); void x.offsetWidth; x.classList.add("shake"); });
    fb.textContent = "Try again!"; fb.className = "feedback no";
    clearPick();
  }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest(".pic, .tag");
  if (el) handle(el);
});
document.addEventListener("animationend", (e) => e.target.classList.remove("shake", "pop"));
winBtn.addEventListener("click", () => {
  if (round < ROUNDS) nextRound(); else startGame();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

startGame();
</script>
