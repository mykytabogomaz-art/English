<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A or An?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one compact play card — an Unsplash photo, a sentence with a gap under it, two chunky keys (A / An), a 15-bead progress string on top */
:root {
  --bg: #F3F6FB;
  --card: #FFFFFF;
  --ink: #1E2A3B;
  --muted: #5F6F86;
  --line: #DCE3EE;
  --stage: #EAF0F8;
  --a: #2F74C9;
  --an: #C8467A;
  --good: #2E9A5B;
  --bad: #D0473C;
  --good-soft: #E3F5EA;
  --bad-soft: #FBE7E5;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A26; --card: #1B2534; --ink: #EEF2F8; --muted: #9AA8BC; --line: #2C3A4F; --stage: #233046;
    --a: #5E9BE6; --an: #E27AA3;
    --good: #5CC487; --bad: #F07A6F; --good-soft: #1D3A2A; --bad-soft: #3D2321;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A26; --card: #1B2534; --ink: #EEF2F8; --muted: #9AA8BC; --line: #2C3A4F; --stage: #233046;
  --a: #5E9BE6; --an: #E27AA3;
  --good: #5CC487; --bad: #F07A6F; --good-soft: #1D3A2A; --bad-soft: #3D2321;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; margin: 0; }
h1 .w-a { color: var(--a); } h1 .w-an { color: var(--an); }
.score { font-weight: 800; font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.score b { color: var(--ink); font-size: 1.25rem; }
.beads { display: flex; gap: 6px; flex-wrap: wrap; }
.bead { width: 14px; height: 14px; border-radius: 50%; background: var(--line); transition: transform .2s; }
.bead.now { background: var(--ink); transform: scale(1.25); }
.bead.ok { background: var(--good); }
.bead.no { background: var(--bad); }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 12px 14px; display: grid; gap: 9px; }
.qno { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.stage { background: var(--stage); border-radius: 18px; padding: 8px 8px 6px; display: grid; justify-items: center; gap: 2px; }

/* The photo: whole picture always visible inside a fixed-size box */
.photo { position: relative; width: 100%; height: clamp(165px, 46vw, 245px); border-radius: 14px; overflow: hidden; background: var(--card); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: contain; object-position: center; display: block; }
.photo img.pop { animation: pop .35s ease-out; }
.nophoto { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); font-weight: 700; }
.credit { font-size: .7rem; color: var(--muted); margin-top: -2px; }
.credit a { color: inherit; }

.question { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.4; text-align: center; text-wrap: balance; width: 100%; min-height: 2.9em; display: grid; place-items: center; }
.gap { display: inline-block; min-width: 2.4em; padding: 0 .3em; margin: 0 .1em; border-bottom: 4px dashed var(--muted); border-radius: 6px 6px 0 0; line-height: 1.2; vertical-align: baseline; }
.gap:empty::before { content: "\00a0"; }
.first { color: var(--good); }
.gap.ok { background: var(--good-soft); border-bottom: 4px solid var(--good); }
.gap.no { background: var(--bad-soft); border-bottom: 4px solid var(--bad); }
.hear { font: inherit; font-weight: 700; font-size: .9rem; color: var(--muted); background: none; border: 2px solid var(--line); border-radius: 999px; padding: 2px 12px; cursor: pointer; }
.hear:hover { color: var(--ink); border-color: var(--muted); }

.keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.key {
  --c: var(--a);
  font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; line-height: 1;
  padding: 9px 6px 8px; border-radius: 16px; cursor: pointer;
  color: #fff; background: var(--c); border: none; min-width: 0;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 60%, #000);
  transition: transform .08s, box-shadow .08s, opacity .2s;
  display: grid; gap: 3px; justify-items: center; align-content: center;
}
.key .ua { font-family: var(--font-body); font-size: .85rem; font-weight: 800; line-height: 1.2; text-align: center; opacity: .95; }
.key small { font-family: var(--font-body); font-size: .72rem; font-weight: 700; opacity: .85; }
.key:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 color-mix(in srgb, var(--c) 60%, #000); }
.key:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 60%, #000); }
.key:focus-visible, .btn:focus-visible, .hear:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.key[data-p="an"] { --c: var(--an); }
.key:disabled { cursor: default; opacity: .35; }
.key.right { opacity: 1; outline: 5px solid var(--good); outline-offset: 3px; }
.key.wrong { opacity: 1; animation: shake .4s; outline: 5px solid var(--bad); outline-offset: 3px; }

.btn { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; padding: 8px 20px; border-radius: 14px; border: none; cursor: pointer; background: var(--ink); color: var(--card); }
.btn:hover { opacity: .9; }

.end { text-align: center; justify-items: center; }
.end .big { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stars { font-size: 2.6rem; letter-spacing: 6px; }
.praise { margin: 0; font-size: 1.05rem; }
.recap { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.recap div { background: var(--stage); border-radius: 14px; padding: 6px 4px; display: grid; justify-items: center; gap: 4px; font-weight: 800; font-size: .85rem; border: 2px solid transparent; }
.recap div.no { border-color: var(--bad); }
.recap img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; display: block; background: var(--card); }
.hint { font-size: .85rem; color: var(--muted); text-align: center; margin: 0; }

@keyframes pop { 0% { transform: scale(.7); opacity: .2; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@media (prefers-reduced-motion: reduce) { .photo img.pop, .key.wrong { animation: none; } .key, .bead { transition: none; } }
@media (max-width: 380px) { .key { font-size: 1.5rem; } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span class="w-a">A</span> or <span class="w-an">An</span>?</h1>
    <div class="score">Score <b id="scoreNum">0</b> / 15</div>
  </header>
  <div class="beads" id="beads" aria-hidden="true"></div>

  <main class="card" id="game">
    <div class="qno" id="qno">Question 1 of 15</div>
    <div class="stage">
      <div class="photo" id="photoBox"><img id="photo" alt=""><p class="nophoto" id="nophoto" hidden>The photo can't load here. Open the page in your web browser to see it.</p></div>
      <div class="credit" id="credit">Photo: <a id="creditLink" href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a></div>
      <div class="question" id="question"><span>This is <span class="gap"></span> avocado.</span></div>
      <button class="hear" id="hear" type="button">🔊 Listen</button>
    </div>
    <div class="keys" id="keys">
      <button class="key" id="k-a" data-p="a" type="button">A</button>
      <button class="key" id="k-an" data-p="an" type="button">An<small>a, e, i, o, u</small></button>
    </div>
    <button class="btn" id="next" type="button" style="visibility:hidden" disabled>Next ➜</button>
  </main>

  <section class="card end" id="end" hidden>
    <div class="stars" id="stars"></div>
    <div class="big" id="final"></div>
    <p class="praise" id="praise"></p>
    <div class="recap" id="recap"></div>
  </section>

  <p class="hint">Tip: you can also press 1 or 2 on the keyboard.</p>
</div>

<script>
// Photos from Unsplash (free Unsplash License). The envelope is a drawn vector picture.
const ENVELOPE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <rect x="60" y="50" width="360" height="230" rx="18" fill="#F6E7C8" stroke="#9A7440" stroke-width="8"/>
  <path d="M68 270 L200 160 M412 270 L280 160" fill="none" stroke="#C9A66B" stroke-width="7" stroke-linecap="round"/>
  <path d="M66 60 L240 190 L414 60" fill="#EAD3A6" stroke="#9A7440" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="240" cy="186" r="22" fill="#D0473C"/>
  <path d="M240 197 l-11-11 a7 7 0 0 1 11-9 a7 7 0 0 1 11 9 z" fill="#FFFFFF"/>
  <rect x="340" y="78" width="52" height="62" rx="4" fill="#FFFFFF" stroke="#2F74C9" stroke-width="5" stroke-dasharray="6 4"/>
  <rect x="351" y="90" width="30" height="38" rx="2" fill="#2F74C9"/>
</svg>`;
const QUESTIONS = [
  { w: "avocado", p: "an", img: "photo-1704960961278-a0376a031054", by: "John Vid", page: "an-avocado-cut-in-half-on-a-white-surface-gcfeUzFW2i0" },
  { w: "envelope", p: "an", svg: ENVELOPE_SVG },
  { w: "orange", p: "an", img: "photo-1565889673234-ffdec2782d1c", by: "Jessica Johnston", page: "round-orange-fruit-tCbAPUqxJxY" },
  { w: "elephant", p: "an", img: "photo-1557050543-4d5f4e07ef46", by: "Nam Anh", page: "elephant-walking-during-daytime-QJbyG6O0ick" },
  { w: "owl", p: "an", img: "photo-1553264701-d138db4fd5d4", by: "Zdeněk Macháček", page: "brown-and-white-owl-oqYHtXrLXLo" },
  { w: "umbrella", p: "an", img: "photo-1415120735457-ac2559460957", by: "Beto Galetto", page: "opened-striped-umbrella-6WVpKJY3t2U" },
  { w: "octopus", p: "an", img: "photo-1628944681206-2ee8d63b0a6b", by: "Diane Picchiottino", page: "octopus-on-rock-in-aquarium-dW0gfo__uU8" },
  { w: "iron", p: "an", img: "photo-1489274495757-95c7c837b101", by: "Filip Mroz", page: "white-and-teal-steam-clothes-iron-plugged-on-ironing-board-gma1zfS3_6E" },
  { w: "giraffe", p: "a", img: "photo-1549854233-ca0baec6fa74", by: "Sofia Zubiria", page: "giraffe-standing-on-green-grass-during-daytime-UqB0TfIdqNE" },
  { w: "penguin", p: "a", img: "photo-1462888210965-cdf193fb74de", by: "Jay Ruzesky", page: "penguin-standing-on-black-rock-9zTafGVsv-c" },
  { w: "banana", p: "a", img: "photo-1587132137056-bfbf0166836e", by: "Mockup Graphics", page: "yellow-banana-on-white-background-Kl3467edwsE" },
  { w: "camera", p: "a", img: "photo-1516852294404-5423eaa0d4a9", by: "Jonathan Talbert", page: "black-nikon-camera-against-white-background-VtIQwaUn-GE" },
  { w: "horse", p: "a", img: "photo-1675275604358-650a589fdb96", by: "Roger Starnes Sr", page: "a-brown-and-white-horse-standing-in-a-field-LPh0bvQjvO8" },
  { w: "butterfly", p: "a", img: "photo-1486365404992-e127e0402df1", by: "Boris Smokrovic", page: "closeup-photography-of-butterfly-on-flower-TY_cMZgN3l8" },
  { w: "house", p: "a", img: "photo-1548199379-65b01a23c15b", by: "Jelle van Leest", page: "white-painted-house-on-green-grass-field-0bDfVKA3ys0" }
];
const imgUrl = (q, w) => q.svg
  ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(q.svg)
  : `https://images.unsplash.com/${q.img}?w=${w}&q=75&auto=format&fit=max`;
const $ = id => document.getElementById(id);
const keys = [...document.querySelectorAll(".key")];
const cap = w => w[0].toUpperCase() + w.slice(1);
let order = [], idx = 0, score = 0, results = [], locked = false;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function drawBeads() {
  $("beads").innerHTML = order.map((_, i) => {
    let c = "bead";
    if (i < results.length) c += results[i] ? " ok" : " no";
    else if (i === idx) c += " now";
    return `<span class="${c}"></span>`;
  }).join("");
}

function showQuestion() {
  const q = order[idx];
  locked = false;
  $("qno").textContent = `Question ${idx + 1} of ${order.length}`;
  const img = $("photo");
  img.hidden = false; $("nophoto").hidden = true;
  img.onerror = () => { img.hidden = true; $("nophoto").hidden = false; };
  img.classList.remove("pop");
  img.alt = q.w;
  img.src = imgUrl(q, 800);
  void img.offsetWidth; img.classList.add("pop");
  $("credit").style.visibility = q.svg ? "hidden" : "visible";
  if (!q.svg) {
    $("creditLink").textContent = `${q.by} / Unsplash`;
    $("creditLink").href = `https://unsplash.com/photos/${q.page}`;
  }
  const nextQ = order[idx + 1];
  if (nextQ) { const pre = new Image(); pre.src = imgUrl(nextQ, 800); }
  $("question").innerHTML = `<span>This is <span class="gap" id="gap"></span> <span class="first">${q.w[0]}</span>${q.w.slice(1)}.</span>`;
  keys.forEach(k => { k.disabled = false; k.classList.remove("right", "wrong"); });
  $("next").style.visibility = "hidden"; $("next").disabled = true;
  drawBeads();
}

function answer(p) {
  if (locked) return;
  locked = true;
  const q = order[idx];
  const ok = p === q.p;
  results.push(ok);
  if (ok) score++;
  $("scoreNum").textContent = score;
  keys.forEach(k => {
    k.disabled = true;
    if (k.dataset.p === q.p) k.classList.add("right");
    else if (k.dataset.p === p) k.classList.add("wrong");
  });
  const gap = $("gap");
  gap.textContent = q.p;
  gap.style.color = `var(--${q.p})`;
  gap.className = "gap " + (ok ? "ok" : "no");
  $("next").textContent = idx + 1 < order.length ? "Next ➜" : "See my score ➜";
  $("next").style.visibility = "visible"; $("next").disabled = false;
  $("next").focus({ preventScroll: true });
  drawBeads();
  speak(`This is ${q.p} ${q.w}.`);
}

function finish() {
  $("game").hidden = true;
  $("end").hidden = false;
  const n = order.length;
  const starsN = score === n ? 3 : score >= 11 ? 2 : score >= 6 ? 1 : 0;
  $("stars").textContent = "⭐".repeat(starsN) + "☆".repeat(3 - starsN);
  $("final").textContent = `${score} / ${n}`;
  $("praise").textContent = score === n ? "Perfect! You know when to use a and an!"
    : score >= 11 ? "Very good! Just a few more to practise."
    : score >= 6 ? "Good try! Play again to get even better."
    : "Keep going! Let's practise again together.";
  $("recap").innerHTML = order.map((q, i) =>
    `<div class="${results[i] ? "" : "no"}"><img src="${imgUrl(q, 200)}" alt="${q.w}" loading="lazy"><em style="color:var(--${q.p});font-style:normal">${q.p} ${q.w}</em></div>`
  ).join("");
  idx = n; drawBeads();
}

function start() {
  order = shuffle(QUESTIONS); idx = 0; score = 0; results = [];
  $("scoreNum").textContent = 0;
  $("end").hidden = true; $("game").hidden = false;
  showQuestion();
}

keys.forEach(k => k.addEventListener("click", () => answer(k.dataset.p)));
$("next").addEventListener("click", () => { idx++; idx < order.length ? showQuestion() : finish(); });
$("hear").addEventListener("click", () => { const q = order[idx]; if (q) speak(locked ? `This is ${q.p} ${q.w}.` : `This is, , ${q.w}.`); });
document.addEventListener("keydown", e => {
  if (!$("game").hidden && !locked && ["1","2"].includes(e.key)) answer(keys[+e.key - 1].dataset.p);
});

start();
</script>
</body>
</html>
